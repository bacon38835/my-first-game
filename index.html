<!DOCTYPE html>
<html>
<head>
    <title>My GitHub Clicker Game</title>
    <style>
        body { text-align: center; font-family: sans-serif; background: #222; color: white; padding-top: 50px; }
        button { font-size: 24px; padding: 15px 30px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
        button:hover { background: #0056b3; }
        h1 { font-size: 48px; }
    </style>
</head>
<body>
    <h1>Score: <span id="score">0</span></h1>
    <button onclick="clickButton()">Click Me!</button>

    <script>
        let count = 0;
        function clickButton() {
            count++;
            document.getElementById('score').innerText = count;
        }
    </script>
</body>
</html>
